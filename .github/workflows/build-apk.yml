name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 10
          ls "$ANDROID_HOME/build-tools" | tail -n 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Python invoice engine
        run: python -m py_compile invoice_engine/app.py

      - name: Fetch Persian and English OCR models
        run: bash scripts/fetch_tessdata.sh

      - name: Build offline Persian handwriting model
        run: bash scripts/fetch_bina_onnx.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare versioned APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FactorKhan-6.6.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FactorKhan-6.6.0
          path: dist/FactorKhan-6.6.0.apk
          if-no-files-found: error
